<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --mp-primary so the mobile browser chrome continues the surface. -->
    <meta name="theme-color" content="#0f172a" />

    <title>Trademint — Find verified businesses and get work done</title>
    <meta
      name="description"
      content="Post what your business needs and get real quotes from verified suppliers. Compare offers, negotiate, order and pay in one place. Every industry, pan-India."
    />
    <link rel="canonical" href="https://trademint.example/" />

    <!-- Open Graph / social. Per-page values are set at runtime by useSeo(); these
         are the defaults a crawler sees before React mounts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trademint" />
    <meta property="og:title" content="Trademint — Find verified businesses and get work done" />
    <meta
      property="og:description"
      content="Post what your business needs and get real quotes from verified suppliers. Compare offers, negotiate, order and pay in one place."
    />
    <meta property="og:url" content="https://trademint.example/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter only. One family for the whole product.

         The previous shell loaded Fraunces (a serif) alongside Plus Jakarta Sans,
         which is two families and two requests for a UI that only ever needed one,
         and was the main reason headings and body copy looked unrelated.

         Weights are limited to the four the token scale actually names
         (400/500/600/700). display=swap so first paint never blocks on the font. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
